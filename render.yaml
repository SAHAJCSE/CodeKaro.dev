services:
  - type: web
    name: oops-judge-runner
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: ALLOWED_ORIGINS
        value: https://oops-judge.vercel.app,http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000
