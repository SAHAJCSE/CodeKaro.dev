<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080b13">
  <meta name="description" content="Code Karo — a calmer place to practice code.">
  <title>Code Karo</title>
  <link rel="stylesheet" href="/navbar.css">
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #080b13;
      color: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #080b13;
    }

    .hero-canvas {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: linear-gradient(180deg, rgba(8, 11, 19, .46), rgba(8, 11, 19, .12) 48%, rgba(8, 11, 19, .55));
      content: "";
      pointer-events: none;
    }

    .navbar {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 0 clamp(22px, 6vw, 88px);
      border-bottom: 1px solid rgba(220, 229, 247, .1);
    }

    .navbar-brand {
      color: #f4f6fb;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.02em;
      text-decoration: none;
    }

    .hero-title {
      align-self: center;
      justify-self: center;
      margin: 0;
      padding: 100px 20px 0;
      color: #f4f6fb;
      font-size: clamp(18px, 2.2vw, 25px);
      font-weight: 500;
      letter-spacing: .16em;
      line-height: 1.4;
      text-align: center;
      text-shadow: 0 1px 24px rgba(5, 10, 20, .6);
    }

    @media (max-width: 560px) {
      .navbar { min-height: 64px; }
      .hero-title { padding-top: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <canvas class="hero-canvas" aria-hidden="true"></canvas>
    <nav class="navbar" aria-label="Main navigation">
      <a class="navbar-brand" href="/">Code-Karo.dev</a>
      <div class="split-nav" data-split-nav data-compact-nav>
        <div class="split-nav__links">
          <a class="split-nav__link" href="/" data-nav-link>Home</a>
          <a class="split-nav__link" href="/profile" data-nav-link>Profile</a>
          <a class="split-nav__link" href="/practice" data-nav-link>Practice</a>
        </div>
        <button class="split-nav__expand" type="button" data-nav-expand aria-label="Show all navigation links" aria-expanded="false" tabindex="-1">⌄</button>
      </div>
    </nav>
    <h1 class="hero-title">Code Karo</h1>
  </main>
  <script src="/navbar.js" defer></script>
  <script>
    (() => {
      const canvas = document.querySelector(".hero-canvas");
      const context = canvas.getContext("2d", { alpha: false });
      const colors = ["#1e3fd8", "#f6f8ff", "#a5d8ff", "#38bdf8"];
      const characters = " =+xX0S8#@";
      const cellSize = 18;
      const density = 0.8;
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      let width = 0;
      let height = 0;
      let frame = 0;
      let lastFrame = 0;

      function colorAt(position) {
        const scaled = position * (colors.length - 1);
        const index = Math.min(Math.floor(scaled), colors.length - 2);
        const amount = scaled - index;
        const start = colors[index].match(/[0-9a-f]{2}/gi).map(value => parseInt(value, 16));
        const end = colors[index + 1].match(/[0-9a-f]{2}/gi).map(value => parseInt(value, 16));
        return `rgb(${start.map((value, channel) => Math.round(value + (end[channel] - value) * amount)).join(" ")})`;
      }

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        const scale = Math.min(window.devicePixelRatio || 1, 2);
        width = bounds.width;
        height = bounds.height;
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
        context.setTransform(scale, 0, 0, scale, 0, 0);
        draw(performance.now());
      }

      function draw(now) {
        if (!width || !height) return;
        const time = reducedMotion.matches ? 0 : now * 0.00018;
        context.fillStyle = "#080b13";
        context.fillRect(0, 0, width, height);
        context.textAlign = "center";
        context.textBaseline = "middle";
        context.font = "14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace";

        const columns = Math.ceil(width / cellSize);
        const rows = Math.ceil(height / cellSize);
        for (let row = 0; row < rows; row += 1) {
          const y = row * cellSize + cellSize / 2;
          for (let column = 0; column < columns; column += 1) {
            const x = column * cellSize + cellSize / 2;
            const across = x / Math.max(width, 1);
            const horizon = height * 0.53
              + Math.sin(across * 7.2 + time) * height * 0.095
              + Math.sin(across * 15 - time * 1.4) * height * 0.025;
            const distance = Math.abs(y - horizon) / Math.max(height, 1);
            const wave = Math.max(0, 1 - distance * 3.4);
            const variation = .76 + .24 * Math.sin(across * 19 + row * .42 + time * 2);
            const brightness = wave * variation;
            const noise = (Math.sin(column * 127.1 + row * 311.7) * 43758.5453) % 1;
            if (Math.abs(noise) > density * brightness) continue;

            const colorPosition = Math.min(1, Math.max(0, across * .72 + brightness * .28));
            const characterIndex = Math.min(characters.length - 1, Math.floor(brightness * characters.length));
            context.globalAlpha = .22 + brightness * .75;
            context.fillStyle = colorAt(colorPosition);
            context.fillText(characters[characterIndex], x, y);
          }
        }
        context.globalAlpha = 1;
      }

      function animate(now) {
        if (document.hidden || reducedMotion.matches) {
          frame = 0;
          return;
        }
        if (now - lastFrame >= 50) {
          draw(now);
          lastFrame = now;
        }
        frame = requestAnimationFrame(animate);
      }

      function startAnimation() {
        if (!reducedMotion.matches && !document.hidden && !frame) {
          frame = requestAnimationFrame(animate);
        } else if (reducedMotion.matches) {
          draw(performance.now());
        }
      }

      window.addEventListener("resize", resize);
      document.addEventListener("visibilitychange", startAnimation);
      reducedMotion.addEventListener("change", startAnimation);
      resize();
      startAnimation();
    })();
  </script>
</body>
</html>
