<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120f17">
  <meta name="description" content="Code Karo — a calmer place to practice code.">
  <title>Code Karo</title>
  <link rel="stylesheet" href="/navbar.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --hero-background: #120f17;
      --hero-overlay: linear-gradient(180deg, rgba(18, 15, 23, .48), rgba(18, 15, 23, .08) 48%, rgba(18, 15, 23, .4));
      background: var(--hero-background);
      color: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --hero-background: #f1f1f3;
      --hero-overlay: linear-gradient(180deg, rgba(241, 241, 243, .24), rgba(241, 241, 243, .02) 48%, rgba(241, 241, 243, .34));
      background: var(--hero-background);
      color: #202126;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: var(--hero-background);
    }

    .gradient-ascii-canvas {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .9;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: var(--hero-overlay);
      content: "";
      pointer-events: none;
    }

    .navbar {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 76px;
      padding: 0 clamp(22px, 6vw, 88px);
      border-bottom: 1px solid rgba(220, 229, 247, .1);
    }

    .navbar-brand {
      color: var(--hero-foreground, #f4f4f6);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -.02em;
      text-decoration: none;
    }

    .hero-title {
      align-self: center;
      justify-self: center;
      margin: 0;
      padding: 100px 20px 0;
      color: #f4f4f6;
      font-size: clamp(18px, 2.2vw, 25px);
      font-weight: 500;
      letter-spacing: .16em;
      line-height: 1.4;
      text-align: center;
      text-shadow: 0 1px 24px rgba(5, 10, 20, .6);
    }

    :root[data-theme="light"] .hero {
      background:
        var(--hero-background);
    }

    :root[data-theme="light"] .navbar {
      border-bottom-color: rgba(32, 33, 38, .14);
    }

    :root[data-theme="light"] .navbar-brand,
    :root[data-theme="light"] .hero-title {
      --hero-foreground: #202126;
      color: #202126;
      text-shadow: 0 1px 18px rgba(241, 241, 243, .8);
    }

    @media (max-width: 560px) {
      .navbar { min-height: 64px; }
      .hero-title { padding-top: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="hero">
    <canvas class="gradient-ascii-canvas" aria-hidden="true"></canvas>
    <nav class="navbar" aria-label="Main navigation">
      <a class="navbar-brand" href="/">Code-Karo.dev</a>
      <button class="theme-switch" data-theme-switch type="button" aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-switch__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g class="theme-switch__sun-rays" stroke="currentColor" stroke-linecap="round" stroke-width="1.7">
            <circle cx="12" cy="12" r="3.7" fill="currentColor" stroke="none" />
            <path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4m12.4 12.4 1.4 1.4M2.5 12h2m15 0h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4" />
          </g>
          <g class="theme-switch__moon">
            <circle cx="12" cy="12" r="7.5" fill="currentColor" />
            <circle class="theme-switch__moon-cutout" cx="16" cy="8" r="6" />
          </g>
        </svg>
        <span class="theme-switch__label" data-theme-label>Dark</span>
      </button>
      <div class="split-nav" data-split-nav data-compact-nav>
        <div class="split-nav__links">
          <a class="split-nav__link" href="/" data-nav-link>Home</a>
          <a class="split-nav__link" href="/profile" data-nav-link>Profile</a>
          <a class="split-nav__link" href="/practice" data-nav-link>Practice</a>
        </div>
        <button class="split-nav__expand" type="button" data-nav-expand aria-label="Show all navigation links" aria-expanded="false" tabindex="-1">⌄</button>
      </div>
    </nav>
    <h1 class="hero-title">Code Karo</h1>
  </main>
  <script src="/navbar.js" defer></script>
  <script src="/gradient-ascii.js" defer></script>
</body>
</html>
