<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#120f17">
  <meta name="description" content="Code Karo — a calmer place to practice code.">
  <title>Code Karo</title>
  <link rel="stylesheet" href="/navbar.css">
  <link rel="stylesheet" href="/gooey-nav.css">
  <link rel="stylesheet" href="/theme.css">
  <script src="/theme.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --hero-background: #120f17;
      --hero-overlay: linear-gradient(180deg, rgba(18, 15, 23, .14), rgba(18, 15, 23, .02) 48%, rgba(18, 15, 23, .16));
      background: var(--hero-background);
      color: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --hero-background: #f1f1f3;
      --hero-overlay: linear-gradient(180deg, rgba(241, 241, 243, .24), rgba(241, 241, 243, .02) 48%, rgba(241, 241, 243, .34));
      background: var(--hero-background);
      color: #202126;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      min-width: 320px;
      min-height: 100%;
      margin: 0;
    }

    body { min-height: 100vh; }

    .hero {
      position: relative;
      display: grid;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: var(--hero-background);
    }

    .gradient-ascii-canvas {
      position: absolute;
      z-index: -2;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: .98;
    }

    .hero::after {
      position: absolute;
      z-index: -1;
      inset: 0;
      background: var(--hero-overlay);
      content: "";
      pointer-events: none;
    }

    .navbar {
      position: absolute;
      inset: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 76px;
      padding: 0 clamp(22px, 6vw, 88px);
      border-bottom: 1px solid rgba(220, 229, 247, .06);
    }

    .navbar .theme-switch { position: absolute; right: clamp(22px, 6vw, 88px); }
    .navbar .repository-link { position: absolute; left: clamp(22px, 6vw, 88px); }

    .hero-title {
      align-self: center;
      justify-self: center;
      margin: 0;
      padding: 76px 20px 0;
      color: #f4f4f6;
      font-size: clamp(48px, 10vw, 112px);
      font-weight: 600;
      letter-spacing: -.07em;
      line-height: 1.05;
      text-align: center;
      text-shadow: 0 2px 28px rgba(5, 10, 20, .5);
    }

    .hero-title__text {
      white-space: nowrap;
    }

    .hero-title__cursor {
      display: inline-block;
      width: .075em;
      height: .82em;
      margin-left: .1em;
      background: currentColor;
      vertical-align: -.04em;
      animation: typewriter-cursor 1s steps(2, jump-none) infinite;
    }

    @keyframes typewriter-cursor {
      50% { opacity: 0; }
    }

    :root[data-theme="light"] .hero {
      background:
        var(--hero-background);
    }

    :root[data-theme="light"] .navbar {
      border-bottom-color: rgba(32, 33, 38, .14);
    }

    :root[data-theme="light"] .hero-title {
      --hero-foreground: #202126;
      color: #202126;
      text-shadow: 0 1px 18px rgba(241, 241, 243, .8);
    }

    @media (max-width: 560px) {
      .navbar { min-height: 64px; }
      .hero-title { padding-top: 64px; font-size: clamp(44px, 13vw, 72px); }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        transition-duration: .01ms !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="hero">
    <canvas class="gradient-ascii-canvas" aria-hidden="true"></canvas>
    <header class="navbar">
      <a class="repository-link" href="https://github.com/rajeevranjan4812-star/oops-judge" target="_blank" rel="noopener noreferrer" aria-label="Open the Code-Karo.dev GitHub repository" title="GitHub repository">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.53v-2.08c-3.1.67-3.75-1.32-3.75-1.32-.5-1.28-1.24-1.62-1.24-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15 1 .1.76 2.68 3.76 2.03.1-.72.39-1.21.7-1.49-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.21 1.15-2.99-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.14a10.6 10.6 0 0 1 5.55 0c2.11-1.44 3.05-1.14 3.05-1.14.61 1.54.23 2.68.11 2.96.72.78 1.15 1.77 1.15 2.99 0 4.29-2.61 5.24-5.1 5.51.4.35.75 1.02.75 2.06V22c0 .29.2.63.76.53A11.1 11.1 0 0 0 12 .9Z"/></svg>
      </a>
      <button class="theme-switch" data-theme-switch type="button" aria-label="Switch theme" aria-pressed="false">
        <svg class="theme-switch__icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <g class="theme-switch__sun-rays" stroke="currentColor" stroke-linecap="round" stroke-width="1.7">
            <circle cx="12" cy="12" r="3.7" fill="currentColor" stroke="none" />
            <path d="M12 2.5v2M12 19.5v2M4.4 4.4l1.4 1.4m12.4 12.4 1.4 1.4M2.5 12h2m15 0h2M4.4 19.6l1.4-1.4M18.2 5.8l1.4-1.4" />
          </g>
          <g class="theme-switch__moon">
            <circle cx="12" cy="12" r="7.5" fill="currentColor" />
            <circle class="theme-switch__moon-cutout" cx="16" cy="8" r="6" />
          </g>
        </svg>
        <span class="theme-switch__label" data-theme-label>Dark</span>
      </button>
      <nav class="nav-island" data-nav-island aria-label="Main sections">
        <a class="nav-island__brand" href="/" aria-label="CodeKaro home">CodeKaro</a>
        <div class="nav-island__links">
          <a class="nav-island__link" href="/" data-nav-link>Home</a>
          <a class="nav-island__link" href="/profile" data-nav-link>Profile</a>
          <a class="nav-island__link" href="/practice" data-nav-link>Practice</a>
        </div>
      </nav>
    </header>
    <h1 class="hero-title" aria-label="Code Karo">
      <span class="hero-title__text" data-typewriter aria-hidden="true">Code Karo</span><span class="hero-title__cursor" aria-hidden="true"></span>
    </h1>
  </main>
  <script src="/gooey-nav.js" defer></script>
  <script src="/gradient-ascii.js" defer></script>
  <script src="/type-writer.js" defer></script>
</body>
</html>
